# ForenSort baseline: ResNet-18 + decoder, class-weighted CE on expert ridge-quality levels
name: baseline
seed: 42
data:
  train_csv: data/manifests/train.csv
  val_csv: data/manifests/val.csv      # test.csv is deliberately NOT referenced here
  test_csv: data/manifests/test.csv
  lffs_root: data/ebts/latent/lffs
  size: 512
  stride: 8
  num_workers: 4
train:
  epochs: 25
  batch_size: 16
  lr: 0.0003
  weight_decay: 0.0001
  freeze_epochs: 1         # train only the decoder first, then fine-tune everything
  class_weight_power: 0.5
  select_metric: macro_f1  # preselected: checkpoint + early stopping use this on validation
  patience: 6
  limit_train: 0           # >0 to use a subset (smoke tests)
  limit_val: 0
out_dir: outputs
